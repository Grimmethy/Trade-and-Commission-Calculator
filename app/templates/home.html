<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Trade Calculator</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="home">
    <h1>Trade Calculator</h1>
    <p>Start a trade room and send the link to whoever you're trading with. Both of you can add items live.</p>
    <form method="post" action="/rooms">
      <button type="submit">Start a new trade</button>
    </form>
    {% if private %}
    <p class="history-link"><a href="/history">View past trades</a> &middot; <a href="/commissions">Painting commissions</a> &middot; <a href="/gaps">Catalog gaps</a></p>
    {% endif %}
  </main>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
